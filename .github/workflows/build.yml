name: Build Friends Voice APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install Android SDK Packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/11.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ] && [ -d "$ANDROID_HOME/cmdline-tools/11.0" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/11.0" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Create Voice And Text Chat Android Project
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew -o gradlew
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew.bat -o gradlew.bat
          chmod +x gradlew

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FriendsVoice"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          mkdir -p app/src/main/java/com/example/friendsvoice app/src/main/res/layout app/src/main/res/values

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.friendsvoice'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.friendsvoice"
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="Friends Voice"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Friends Voice</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F4F6F9"
              android:orientation="vertical">

              <!-- Top App Header -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="58dp"
                  android:background="#2B6CB0"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/tvHeaderTitle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Friends Voice"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnTopAdd"
                      android:layout_width="wrap_content"
                      android:layout_height="38dp"
                      android:backgroundTint="#FFFFFF"
                      android:text="+ غرفة"
                      android:textColor="#2B6CB0"
                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- Active Call / Room Banner -->
              <LinearLayout
                  android:id="@+id/activeCallBanner"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:background="#3182CE"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp"
                  android:visibility="gone">

                  <TextView
                      android:id="@+id/tvBannerRoom"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="غرفة صوتية نشطة"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnToggleChat"
                      android:layout_width="wrap_content"
                      android:layout_height="32dp"
                      android:layout_marginEnd="6dp"
                      android:backgroundTint="#2C5282"
                      android:text="الكتابة"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/btnBannerLeave"
                      android:layout_width="wrap_content"
                      android:layout_height="32dp"
                      android:backgroundTint="#E53E3E"
                      android:text="خروج"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />
              </LinearLayout>

              <!-- Main Content Container -->
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <!-- Tab 1: Rooms List -->
                  <LinearLayout
                      android:id="@+id/roomsTabLayout"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="10dp"
                          android:text="اضغط على أي غرفة للانضمام صوتياً وكتابياً — اضغط مطولاً لحذفها"
                          android:textColor="#4A5568"
                          android:textSize="13sp" />

                      <ScrollView
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:fillViewport="true">

                          <LinearLayout
                              android:id="@+id/roomsListContainer"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical" />
                      </ScrollView>
                  </LinearLayout>

                  <!-- Tab 2: Info / Guide -->
                  <LinearLayout
                      android:id="@+id/infoTabLayout"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:padding="20dp"
                      android:visibility="gone">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="طريقة الاستخدام مع الأصدقاء"
                          android:textColor="#1A202C"
                          android:textSize="20sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:lineSpacingExtra="6dp"
                          android:text="1. اضغط على زر (+ غرفة) لإضافة اسم الغرفة التي تريدها.\n2. أرسل نفس اسم الغرفة لصديقك ليدخل معك في نفس الغرفة.\n3. داخل الغرفة يمكنك التحدث صوتياً والكتابة في مربع الرسائل بالأسفل.\n4. اضغط مطولاً على أي غرفة في القائمة لحذفها."
                          android:textColor="#2D3748"
                          android:textSize="15sp" />
                  </LinearLayout>

                  <!-- Active Voice + Text Chat Room -->
                  <LinearLayout
                      android:id="@+id/roomLiveLayout"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="#FFFFFF"
                      android:orientation="vertical"
                      android:visibility="gone">

                      <!-- Live Voice Section -->
                      <WebView
                          android:id="@+id/webViewVoice"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1" />

                      <!-- Text Chat Section inside the Room -->
                      <LinearLayout
                          android:id="@+id/chatSectionLayout"
                          android:layout_width="match_parent"
                          android:layout_height="230dp"
                          android:background="#EDF2F7"
                          android:orientation="vertical"
                          android:padding="8dp">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:paddingBottom="4dp"
                              android:text="الدردشة الكتابية داخل الغرفة"
                              android:textColor="#2B6CB0"
                              android:textSize="13sp"
                              android:textStyle="bold" />

                          <ScrollView
                              android:id="@+id/chatScrollView"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="1"
                              android:background="#FFFFFF"
                              android:padding="8dp">

                              <TextView
                                  android:id="@+id/tvChatMessages"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="مرحباً بك في الدردشة الكتابية للغرفة. اكتب رسالتك بالأسفل..."
                                  android:textColor="#1A202C"
                                  android:textSize="14sp" />
                          </ScrollView>

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <EditText
                                  android:id="@+id/etChatInput"
                                  android:layout_width="0dp"
                                  android:layout_height="44dp"
                                  android:layout_weight="1"
                                  android:background="#FFFFFF"
                                  android:hint="اكتب رسالة هنا..."
                                  android:inputType="text"
                                  android:paddingStart="12dp"
                                  android:paddingEnd="12dp"
                                  android:textColor="#1A202C"
                                  android:textSize="14sp" />

                              <Button
                                  android:id="@+id/btnSendChat"
                                  android:layout_width="wrap_content"
                                  android:layout_height="44dp"
                                  android:layout_marginStart="6dp"
                                  android:backgroundTint="#2B6CB0"
                                  android:text="إرسال"
                                  android:textColor="#FFFFFF"
                                  android:textSize="13sp" />
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
              </FrameLayout>

              <!-- Bottom Navigation Bar -->
              <LinearLayout
                  android:id="@+id/bottomBar"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:background="#FFFFFF"
                  android:elevation="8dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/btnNavRooms"
                      style="?android:attr/borderlessButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:text="الغرف"
                      android:textColor="#2B6CB0"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnNavAdd"
                      style="?android:attr/borderlessButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:text="+ إضافة"
                      android:textColor="#2D3748"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnNavInfo"
                      style="?android:attr/borderlessButtonStyle"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:text="الإرشادات"
                      android:textColor="#2D3748"
                      android:textSize="15sp"
                      android:textStyle="bold" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/friendsvoice/MainActivity.java
          package com.example.friendsvoice;

          import android.Manifest;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends AppCompatActivity {

              private static final String PREFS_NAME = "FriendsVoicePrefs";
              private static final String KEY_ROOMS = "saved_rooms";

              private LinearLayout roomsTabLayout;
              private LinearLayout infoTabLayout;
              private LinearLayout roomLiveLayout;
              private LinearLayout chatSectionLayout;
              private LinearLayout activeCallBanner;
              private LinearLayout roomsListContainer;
              private ScrollView chatScrollView;
              private TextView tvHeaderTitle;
              private TextView tvBannerRoom;
              private TextView tvChatMessages;
              private EditText etChatInput;
              private Button btnNavRooms;
              private Button btnNavInfo;
              private WebView webViewVoice;

              private final List<String> roomsList = new ArrayList<>();
              private boolean isInCall = false;
              private boolean isChatVisible = true;
              private String currentRoomCode = "";
              private static final String KEY_EMAIL = "user_email";
              private String currentUserEmail = "";
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  roomsTabLayout = findViewById(R.id.roomsTabLayout);
                  infoTabLayout = findViewById(R.id.infoTabLayout);
                  roomLiveLayout = findViewById(R.id.roomLiveLayout);
                  chatSectionLayout = findViewById(R.id.chatSectionLayout);
                  activeCallBanner = findViewById(R.id.activeCallBanner);
                  roomsListContainer = findViewById(R.id.roomsListContainer);
                  chatScrollView = findViewById(R.id.chatScrollView);
                  tvHeaderTitle = findViewById(R.id.tvHeaderTitle);
                  tvBannerRoom = findViewById(R.id.tvBannerRoom);
                  tvChatMessages = findViewById(R.id.tvChatMessages);
                  etChatInput = findViewById(R.id.etChatInput);
                  btnNavRooms = findViewById(R.id.btnNavRooms);
                  btnNavInfo = findViewById(R.id.btnNavInfo);
                  webViewVoice = findViewById(R.id.webViewVoice);

                  Button btnTopAdd = findViewById(R.id.btnTopAdd);
                  Button btnNavAdd = findViewById(R.id.btnNavAdd);
                  Button btnBannerLeave = findViewById(R.id.btnBannerLeave);
                  Button btnToggleChat = findViewById(R.id.btnToggleChat);
                  Button btnSendChat = findViewById(R.id.btnSendChat);

                  requestMicPermission();
                  setupWebView();
                  loadSavedRooms();
                  renderRoomsCards();
                  showRoomsTab();
                  if (chatScrollView != null) {
                  android.view.ViewGroup.LayoutParams p = chatScrollView.getLayoutParams();
                  if (p != null) {
                  p.height = 190;
                  chatScrollView.setLayoutParams(p);
                  }
                  }
                  checkEmailLogin();

                  btnTopAdd.setOnClickListener(v -> showAddRoomDialog());
                  btnNavAdd.setOnClickListener(v -> showAddRoomDialog());
                  btnNavRooms.setOnClickListener(v -> {
                      if (!isInCall) {
                          showRoomsTab();
                      }
                  });
                  btnNavInfo.setOnClickListener(v -> {
                      if (!isInCall) {
                          showInfoTab();
                      }
                  });
                  btnBannerLeave.setOnClickListener(v -> leaveLiveRoom());

                  btnToggleChat.setOnClickListener(v -> {
                      isChatVisible = !isChatVisible;
                      chatSectionLayout.setVisibility(isChatVisible ? View.VISIBLE : View.GONE);
                      btnToggleChat.setText(isChatVisible ? "إخفاء الكتابة" : "الكتابة");
                  });

                  btnSendChat.setOnClickListener(v -> sendChatMessage());
              }

              private void sendChatMessage() {
                  String msg = etChatInput.getText().toString().trim();
                  if (msg.isEmpty()) {
                      return;
                  }
                  appendChatLine("أنا: " + msg);
                  etChatInput.setText("");

                  if (webViewVoice != null && !currentRoomCode.isEmpty()) {
                      String escaped = msg.replace("\\", "\\\\").replace("'", "\\'");
                      String js = "(function() {"
                              + "var inputs = document.querySelectorAll('input[type=\"text\"], textarea');"
                              + "for (var i = 0; i < inputs.length; i++) {"
                              + "  var el = inputs[i];"
                              + "  if (el.offsetParent !== null) {"
                              + "    el.focus();"
                              + "    el.value = '" + escaped + "';"
                              + "    el.dispatchEvent(new Event('input', { bubbles: true }));"
                              + "    var ev = new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true });"
                              + "    el.dispatchEvent(ev);"
                              + "    break;"
                              + "  }"
                              + "}"
                              + "})();";
                      webViewVoice.evaluateJavascript(js, null);
                  }
              }

              private void appendChatLine(String line) {
                  String currentText = tvChatMessages.getText().toString();
                  if (currentText.startsWith("مرحباً بك في الدردشة الكتابية")) {
                      tvChatMessages.setText(line);
                  } else {
                      tvChatMessages.setText(currentText + "\n" + line);
                  }
                  chatScrollView.post(() -> chatScrollView.fullScroll(View.FOCUS_DOWN));
              }

              private void showRoomsTab() {
                  roomLiveLayout.setVisibility(View.GONE);
                  infoTabLayout.setVisibility(View.GONE);
                  roomsTabLayout.setVisibility(View.VISIBLE);
                  tvHeaderTitle.setText("Friends Voice");
                  btnNavRooms.setTextColor(Color.parseColor("#2B6CB0"));
                  btnNavInfo.setTextColor(Color.parseColor("#2D3748"));
              }

              private void showInfoTab() {
                  roomLiveLayout.setVisibility(View.GONE);
                  roomsTabLayout.setVisibility(View.GONE);
                  infoTabLayout.setVisibility(View.VISIBLE);
                  tvHeaderTitle.setText("الإرشادات");
                  btnNavInfo.setTextColor(Color.parseColor("#2B6CB0"));
                  btnNavRooms.setTextColor(Color.parseColor("#2D3748"));
              }

              private void showAddRoomDialog() {
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("إضافة غرفة أو مجموعة جديدة");
                  builder.setMessage("اكتب اسم الغرفة (حروف إنجليزية أو أرقام بدون مسافات):");

                  final EditText input = new EditText(this);
                  input.setHint("مثال: friends-city أو work-team");
                  input.setPadding(40, 24, 40, 24);
                  builder.setView(input);

                  builder.setPositiveButton("إضافة", (dialog, which) -> {
                      String cleanCode = input.getText().toString().trim().replaceAll("[^a-zA-Z0-9_-]", "");
                      if (cleanCode.isEmpty()) {
                          Toast.makeText(this, "يرجى كتابة اسم صالح للغرفة", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      if (!roomsList.contains(cleanCode)) {
                          roomsList.add(cleanCode);
                          saveRooms();
                          renderRoomsCards();
                          showRoomsTab();
                          Toast.makeText(this, "تمت إضافة الغرفة: " + cleanCode, Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "هذه الغرفة موجودة بالفعل", Toast.LENGTH_SHORT).show();
                      }
                  });

                  builder.setNegativeButton("إلغاء", null);
                  builder.show();
              }

              private void showDeleteRoomDialog(String roomCode) {
                  new AlertDialog.Builder(this)
                          .setTitle("حذف الغرفة")
                          .setMessage("هل تريد حذف الغرفة (" + roomCode + ")؟")
                          .setPositiveButton("حذف", (dialog, which) -> {
                              roomsList.remove(roomCode);
                              saveRooms();
                              renderRoomsCards();
                          })
                          .setNegativeButton("إلغاء", null)
                          .show();
              }

              private void loadSavedRooms() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  Set<String> savedSet = prefs.getStringSet(KEY_ROOMS, null);
                  roomsList.clear();
                  if (savedSet != null) {
                      roomsList.addAll(savedSet);
                  }
              }

              private void saveRooms() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  prefs.edit().putStringSet(KEY_ROOMS, new LinkedHashSet<>(roomsList)).apply();
              }

              private void renderRoomsCards() {
                  roomsListContainer.removeAllViews();
                  LinearLayout quickJoinBar = new LinearLayout(this);
                  quickJoinBar.setOrientation(LinearLayout.HORIZONTAL);
                  quickJoinBar.setGravity(android.view.Gravity.CENTER_VERTICAL);
                  quickJoinBar.setPadding(20, 14, 20, 14);
                  quickJoinBar.setBackgroundColor(Color.parseColor("#F5F7FA"));

                  final EditText etQuickJoin = new EditText(this);
                  etQuickJoin.setHint("اكتب اسم الغرفة للدخول...");
                  etQuickJoin.setSingleLine(true);
                  etQuickJoin.setTextSize(14f);
                  etQuickJoin.setPadding(20, 14, 20, 14);
                  LinearLayout.LayoutParams etParams = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  etParams.setMargins(0, 0, 14, 0);
                  etQuickJoin.setLayoutParams(etParams);

                  Button btnQuickJoin = new Button(this);
                  btnQuickJoin.setText("دخول");
                  btnQuickJoin.setTextColor(Color.WHITE);
                  btnQuickJoin.setBackgroundColor(Color.parseColor("#1976D2"));

                  btnQuickJoin.setOnClickListener(v -> {
                  String raw = etQuickJoin.getText() != null ? etQuickJoin.getText().toString().trim() : "";
                  String cleanCode = raw.replaceAll("[^a-zA-Z0-9_-]", "");
                  if (cleanCode.isEmpty()) {
                  Toast.makeText(this, "أدخل اسم غرفة صحيحاً", Toast.LENGTH_SHORT).show();
                  return;
                  }
                  if (!roomsList.contains(cleanCode)) {
                  Toast.makeText(this, "هذه الغرفة غير موجودة", Toast.LENGTH_SHORT).show();
                  return;
                  }

                  tryJoinGroup(cleanCode);
                  });

                  quickJoinBar.addView(etQuickJoin);
                  quickJoinBar.addView(btnQuickJoin);
                  roomsListContainer.addView(quickJoinBar);

                  if (roomsList.isEmpty()) {
                      TextView emptyText = new TextView(this);
                      emptyText.setText("لا توجد غرف بعد.\nاضغط على (+ غرفة) في الأعلى لإضافة غرفتك الأولى.");
                      emptyText.setTextColor(Color.parseColor("#4A5568"));
                      emptyText.setTextSize(15f);
                      emptyText.setGravity(View.TEXT_ALIGNMENT_CENTER);
                      emptyText.setPadding(24, 60, 24, 24);
                      roomsListContainer.addView(emptyText);
                      return;
                  }

                  for (String room : roomsList) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(View.TEXT_ALIGNMENT_GRAVITY);
                      row.setBackgroundColor(Color.WHITE);
                      row.setPadding(28, 24, 28, 24);

                      LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                      );
                      rowParams.setMargins(0, 0, 0, 18);
                      row.setLayoutParams(rowParams);

                      TextView badge = new TextView(this);
                      String initials = room.length() >= 2 ? room.substring(0, 2).toUpperCase() : room.toUpperCase();
                      badge.setText(initials);
                      badge.setTextColor(Color.WHITE);
                      badge.setTextSize(16f);
                      badge.setBackgroundColor(Color.parseColor("#3182CE"));
                      badge.setPadding(28, 22, 28, 22);

                      TextView roomTitle = new TextView(this);
                      roomTitle.setText("  " + room);
                      roomTitle.setTextColor(Color.parseColor("#1A202C"));
                      roomTitle.setTextSize(17f);
                      roomTitle.setPadding(24, 16, 12, 16);

                      row.addView(badge);
                      row.addView(roomTitle);

                      row.setOnClickListener(v -> tryJoinGroup(room));
                      row.setOnLongClickListener(v -> {
                          showDeleteRoomDialog(room);
                          return true;
                      });

                      roomsListContainer.addView(row);
                  }
              }

              private void tryJoinGroup(String roomCode) {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestMicPermission();
                      Toast.makeText(this, "يرجى السماح بصلاحية الميكروفون أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  joinLiveRoom(roomCode);
              }

              private void requestMicPermission() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this,
                              new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.MODIFY_AUDIO_SETTINGS}, 101);
                  }
              }

              private void setupWebView() {
                  WebSettings settings = webViewVoice.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUserAgentString("Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");

                  webViewVoice.setWebViewClient(new WebViewClient());
                  webViewVoice.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });
              }

              private void joinLiveRoom(String roomCode) {
                  AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) {
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audioManager.setSpeakerphoneOn(true);
                  }
                  currentRoomCode = roomCode;
                  isInCall = true;
                  isChatVisible = true;
                  chatSectionLayout.setVisibility(View.VISIBLE);
                  tvChatMessages.setText("مرحباً بك في الدردشة الكتابية للغرفة: " + roomCode);

                  roomsTabLayout.setVisibility(View.GONE);
                  infoTabLayout.setVisibility(View.GONE);
                  roomLiveLayout.setVisibility(View.VISIBLE);
                  activeCallBanner.setVisibility(View.VISIBLE);
                  tvBannerRoom.setText("صوت وكتابة في الغرفة: " + roomCode);
                  tvHeaderTitle.setText(roomCode);

                  String url = "https://meet.jit.si/FriendsVoice_" + roomCode
                          + "#config.startWithAudioMuted=true&config.startWithVideoMuted=true&config.prejoinPageEnabled=false&config.disableDeepLinking=true&interfaceConfig.DISABLE_JOIN_LEAVE_NOTIFICATIONS=true";
                  webViewVoice.loadUrl(url);
              }

              private void leaveLiveRoom() {
                  isInCall = false;
                  currentRoomCode = "";
                  webViewVoice.loadUrl("about:blank");
                  activeCallBanner.setVisibility(View.GONE);
                  showRoomsTab();
              }

              @Override
              protected void onDestroy() {
                  if (webViewVoice != null) {
                      webViewVoice.destroy();
                  }
                      super.onDestroy();
                 }
            }
          }
   
             private void checkEmailLogin() {
             android.content.SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
             currentUserEmail = prefs.getString(KEY_EMAIL, "");
             if (currentUserEmail == null || currentUserEmail.trim().isEmpty()) {
            askEmailDialog();
              }
            }

            private void askEmailDialog() {
            android.app.AlertDialog.Builder b = new android.app.AlertDialog.Builder(this);
            b.setTitle("تسجيل الدخول بالإيميل");
            b.setMessage("اكتب بريدك الإلكتروني:");
            final android.widget.EditText input = new android.widget.EditText(this);
            input.setHint("name@email.com");
            input.setInputType(android.text.InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
            b.setView(input);
            b.setCancelable(false);
            b.setPositiveButton("حفظ", (d, w) -> {
            String email = input.getText().toString().trim();
            if (!email.contains("@") || !email.contains(".")) {
                android.widget.Toast.makeText(this, "إيميل غير صحيح", android.widget.Toast.LENGTH_SHORT).show();
                askEmailDialog();
                return;
            }
            currentUserEmail = email;
            getSharedPreferences(PREFS_NAME, MODE_PRIVATE).edit().putString(KEY_EMAIL, email).apply();
        });
        b.show();
    }
    }


