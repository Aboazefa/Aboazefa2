name: Build Friends Voice APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/11.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ] && [ -d "$ANDROID_HOME/cmdline-tools/11.0" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/11.0" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Custom Rooms Android Project
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew -o gradlew
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew.bat -o gradlew.bat
          chmod +x gradlew

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FriendsVoice"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          mkdir -p app/src/main/java/com/example/friendsvoice app/src/main/res/layout app/src/main/res/values

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.friendsvoice'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.friendsvoice"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="Friends Voice"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Friends Voice</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <LinearLayout
                  android:id="@+id/roomsScreen"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center"
                      android:paddingTop="12dp"
                      android:text="الغرف والمجموعات"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:layout_marginBottom="16dp"
                      android:gravity="center"
                      android:text="اضغط على زر الإضافة لإنشاء غرفة جديدة، أو اضغط مطولاً على أي غرفة لحذفها"
                      android:textSize="13sp" />

                  <Button
                      android:id="@+id/btnAddRoom"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:layout_marginBottom="16dp"
                      android:text="+ إضافة غرفة جديدة"
                      android:textSize="16sp" />

                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:fillViewport="true">

                      <LinearLayout
                          android:id="@+id/roomsListContainer"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical" />
                  </ScrollView>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/roomLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:visibility="gone">

                  <TextView
                      android:id="@+id/tvActiveGroup"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center"
                      android:padding="8dp"
                      android:text="الغرفة النشطة"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <WebView
                      android:id="@+id/webViewVoice"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1" />

                  <Button
                      android:id="@+id/btnLeave"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="العودة إلى قائمة الغرف" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/friendsvoice/MainActivity.java
          package com.example.friendsvoice;

          import android.Manifest;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends AppCompatActivity {

              private static final String PREFS_NAME = "FriendsVoicePrefs";
              private static final String KEY_ROOMS = "saved_rooms";

              private LinearLayout roomsScreen;
              private LinearLayout roomsListContainer;
              private LinearLayout roomLayout;
              private TextView tvActiveGroup;
              private WebView webViewVoice;

              private final List<String> roomsList = new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  roomsScreen = findViewById(R.id.roomsScreen);
                  roomsListContainer = findViewById(R.id.roomsListContainer);
                  roomLayout = findViewById(R.id.roomLayout);
                  tvActiveGroup = findViewById(R.id.tvActiveGroup);
                  webViewVoice = findViewById(R.id.webViewVoice);

                  Button btnAddRoom = findViewById(R.id.btnAddRoom);
                  Button btnLeave = findViewById(R.id.btnLeave);

                  requestMicPermission();
                  setupWebView();
                  loadSavedRooms();
                  renderRoomsButtons();

                  btnAddRoom.setOnClickListener(v -> showAddRoomDialog());
                  btnLeave.setOnClickListener(v -> leaveLiveRoom());
              }

              private void showAddRoomDialog() {
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("إضافة غرفة جديدة");
                  builder.setMessage("اكتب اسم الغرفة أو المجموعة (يفضل حروف إنجليزية وأرقام):");

                  final EditText input = new EditText(this);
                  input.setHint("مثال: team-room أو city1");
                  input.setPadding(40, 24, 40, 24);
                  builder.setView(input);

                  builder.setPositiveButton("إضافة", (dialog, which) -> {
                      String rawName = input.getText().toString().trim();
                      String cleanCode = rawName.replaceAll("[^a-zA-Z0-9_-]", "");
                      if (cleanCode.isEmpty()) {
                          Toast.makeText(this, "يرجى إدخال اسم صالح للغرفة", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      if (!roomsList.contains(cleanCode)) {
                          roomsList.add(cleanCode);
                          saveRooms();
                          renderRoomsButtons();
                          Toast.makeText(this, "تمت إضافة الغرفة: " + cleanCode, Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "هذه الغرفة موجودة بالفعل", Toast.LENGTH_SHORT).show();
                      }
                  });

                  builder.setNegativeButton("إلغاء", (dialog, which) -> dialog.cancel());
                  builder.show();
              }

              private void showDeleteRoomDialog(String roomCode) {
                  new AlertDialog.Builder(this)
                          .setTitle("حذف الغرفة")
                          .setMessage("هل تريد حذف الغرفة (" + roomCode + ") من القائمة؟")
                          .setPositiveButton("حذف", (dialog, which) -> {
                              roomsList.remove(roomCode);
                              saveRooms();
                              renderRoomsButtons();
                              Toast.makeText(this, "تم حذف الغرفة", Toast.LENGTH_SHORT).show();
                          })
                          .setNegativeButton("إلغاء", null)
                          .show();
              }

              private void loadSavedRooms() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  Set<String> savedSet = prefs.getStringSet(KEY_ROOMS, null);
                  roomsList.clear();
                  if (savedSet != null) {
                      roomsList.addAll(savedSet);
                  }
              }

              private void saveRooms() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  Set<String> setToSave = new LinkedHashSet<>(roomsList);
                  prefs.edit().putStringSet(KEY_ROOMS, setToSave).apply();
              }

              private void renderRoomsButtons() {
                  roomsListContainer.removeAllViews();

                  if (roomsList.isEmpty()) {
                      TextView emptyText = new TextView(this);
                      emptyText.setText("لا توجد غرف مضافة بعد. اضغط على (+ إضافة غرفة جديدة) للبدء.");
                      emptyText.setTextSize(15sp);
                      emptyText.setGravity(View.TEXT_ALIGNMENT_CENTER);
                      emptyText.setPadding(16, 40, 16, 16);
                      roomsListContainer.addView(emptyText);
                      return;
                  }

                  for (String room : roomsList) {
                      Button roomBtn = new Button(this);
                      roomBtn.setText("غرفة: " + room);
                      roomBtn.setTextSize(16sp);
                      LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              150
                      );
                      params.setMargins(0, 0, 0, 24);
                      roomBtn.setLayoutParams(params);

                      roomBtn.setOnClickListener(v -> tryJoinGroup(room));
                      roomBtn.setOnLongClickListener(v -> {
                          showDeleteRoomDialog(room);
                          return true;
                      });

                      roomsListContainer.addView(roomBtn);
                  }
              }

              private void tryJoinGroup(String roomCode) {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestMicPermission();
                      Toast.makeText(this, "يرجى السماح بصلاحية الميكروفون أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  joinLiveRoom(roomCode);
              }

              private void requestMicPermission() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this,
                              new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.MODIFY_AUDIO_SETTINGS}, 101);
                  }
              }

              private void setupWebView() {
                  WebSettings settings = webViewVoice.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUserAgentString("Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");

                  webViewVoice.setWebViewClient(new WebViewClient());
                  webViewVoice.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });
              }

              private void joinLiveRoom(String roomCode) {
                  AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) {
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audioManager.setSpeakerphoneOn(true);
                  }
                  tvActiveGroup.setText("متصل الآن في الغرفة: " + roomCode);
                  roomsScreen.setVisibility(View.GONE);
                  roomLayout.setVisibility(View.VISIBLE);
                  String url = "https://meet.jit.si/FriendsVoice_" + roomCode
                          + "#config.startWithAudioMuted=false&config.startWithVideoMuted=true&config.prejoinPageEnabled=false&interfaceConfig.DISABLE_JOIN_LEAVE_NOTIFICATIONS=true";
                  webViewVoice.loadUrl(url);
              }

              private void leaveLiveRoom() {
                  webViewVoice.loadUrl("about:blank");
                  roomLayout.setVisibility(View.GONE);
                  roomsScreen.setVisibility(View.VISIBLE);
              }

              @Override
              protected void onDestroy() {
                  if (webViewVoice != null) {
                      webViewVoice.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: friends-voice-apk
          path: app/build/outputs/apk/debug/*.apk
          
